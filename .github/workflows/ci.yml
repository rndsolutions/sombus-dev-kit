name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  upstream:
    name: pinned upstream and skill library checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator dependencies
        # validate_som_skill.py imports PyYAML at run time; the other four are standard library only
        run: pip install pyyaml
      - name: Upstream is byte-for-byte the pinned commit
        run: scripts/verify-upstream.sh
      - name: Skill library validators (upstream's own five)
        run: scripts/check-upstream-skills.sh

  sdk:
    name: SDK, conformance kit and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
